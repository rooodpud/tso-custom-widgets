        <rect x="16" y="0" width="22" height="12" rx="3" fill="#F3692A"/>
        <circle cx="8" cy="30" r="11" fill="#241611"/><circle cx="48" cy="30" r="11" fill="#241611"/>
        <circle cx="27" cy="-10" r="6" fill="#382520"/>
