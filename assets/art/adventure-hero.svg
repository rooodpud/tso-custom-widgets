<svg viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="adSky" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#CDEFEF"/><stop offset="100%" stop-color="#FEC996"/></linearGradient>
        <linearGradient id="adMtn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#807A67"/><stop offset="100%" stop-color="#472D1E"/></linearGradient>
        <linearGradient id="adDune" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F7B06B"/><stop offset="100%" stop-color="#AF4B1A"/></linearGradient>
      </defs>
      <rect width="1200" height="460" fill="url(#adSky)"/>
      <!-- hot air balloon -->
