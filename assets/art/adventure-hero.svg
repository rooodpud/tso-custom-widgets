        <path d="M0 0 C -46 0 -58 44 -38 78 L -14 108 L 14 108 L 38 78 C 58 44 46 0 0 0 Z" fill="#F3692A"/>
        <path d="M0 0 C -16 0 -20 50 -8 108 L 8 108 C 20 50 16 0 0 0 Z" fill="#FFC300"/>
