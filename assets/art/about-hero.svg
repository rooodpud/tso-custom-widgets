<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="abSky" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FEC996"/><stop offset="55%" stop-color="#F7B06B"/><stop offset="100%" stop-color="#CDEFEF"/></linearGradient>
          <linearGradient id="abMtn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#807A67"/><stop offset="100%" stop-color="#472D1E"/></linearGradient>
          <linearGradient id="abSea" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0392CC"/><stop offset="100%" stop-color="#0A4E70"/></linearGradient>
        </defs>
        <rect width="1200" height="420" fill="url(#abSky)"/>
        <circle cx="610" cy="120" r="54" fill="#FFC300"/>
        <!-- mountains (left) -->
        <path d="M0 420 L0 190 L110 110 L220 200 L330 120 L440 220 L480 420 Z" fill="url(#abMtn)"/>
        <!-- fort on the ridge -->
        <g transform="translate(300,150)"><rect x="0" y="20" width="56" height="40" fill="#AF6A2F"/><rect x="18" y="0" width="22" height="22" fill="#B6712A"/><rect x="0" y="14" width="8" height="8" fill="#AF6A2F"/><rect x="48" y="14" width="8" height="8" fill="#AF6A2F"/></g>
        <!-- dunes (middle) -->
        <path d="M380 420 L380 300 Q 520 240 660 290 T 880 280 L880 420 Z" fill="#CE893D"/>
        <path d="M380 420 L380 340 Q 560 300 720 336 T 900 330 L900 420 Z" fill="#AF4B1A"/>
        <!-- rooftop tent 4x4 -->
        <g transform="translate(560,286) scale(.55)">
          <rect x="0" y="40" width="150" height="40" rx="8" fill="#382520"/>
          <rect x="16" y="6" width="90" height="38" rx="8" fill="#382520"/>
          <rect x="10" y="-18" width="104" height="26" rx="6" fill="#F3692A"/>
          <circle cx="32" cy="82" r="15" fill="#241611"/><circle cx="118" cy="82" r="15" fill="#241611"/>
        </g>
        <!-- sea (right) -->
        <path d="M860 420 L860 300 Q 1030 285 1200 300 V420 Z" fill="url(#abSea)"/>
        <g transform="translate(1010,262)"><path d="M0 30 Q 45 42 100 30 L92 42 Q 48 50 8 42 Z" fill="#382520"/><line x1="46" y1="30" x2="46" y2="-4" stroke="#382520" stroke-width="3"/><path d="M46 0 L80 24 L46 24 Z" fill="#F3692A"/></g>
        <!-- palms -->
        <g transform="translate(822,232)"><ellipse cx="14" cy="50" rx="6" ry="28" fill="#2C8828"/><path d="M14 26 C -6 20 -14 6 -16 -6 C 4 0 12 12 14 26 Z" fill="#38A833"/><path d="M14 26 C 34 18 40 4 40 -8 C 22 -2 16 12 14 26 Z" fill="#4EA92D"/></g>
        <!-- guide + guests -->
        <g transform="translate(470,282)" fill="#382520">
          <circle cx="0" cy="0" r="7"/><rect x="-5" y="7" width="10" height="22" rx="3"/><line x1="5" y1="12" x2="22" y2="2" stroke="#382520" stroke-width="3" stroke-linecap="round"/>
          <circle cx="34" cy="4" r="6" fill="#5E3C35"/><rect x="30" y="10" width="9" height="19" rx="3" fill="#5E3C35"/>
          <circle cx="50" cy="5" r="6" fill="#5E3C35"/><rect x="46" y="11" width="9" height="18" rx="3" fill="#5E3C35"/>
        </g>
      </svg>
