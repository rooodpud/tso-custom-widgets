<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg">
          <defs><linearGradient id="skyS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE7B8"/><stop offset="1" stop-color="#FBEBD2"/></linearGradient></defs>
          <rect width="480" height="300" fill="url(#skyS)"/>
          <circle cx="390" cy="58" r="28" fill="#FFC300"/>
          <!-- far peak -->
          <path d="M120 140 L230 50 L330 140 Z" fill="#C9A27A" opacity=".7"/>
