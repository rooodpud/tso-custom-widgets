          <path d="M200 130 L270 132 L262 300 L210 300 Z" fill="#6B4636"/>
          <path d="M228 300 Q234 250 236 200 Q238 170 236 140" stroke="#38A833" stroke-width="3" fill="none" opacity=".6"/>
          <!-- strata lines -->
          <g stroke="#7A5440" stroke-width="2" opacity=".5" fill="none">
            <path d="M0 160 L195 168"/><path d="M0 205 L200 212"/><path d="M0 250 L205 256"/>
            <path d="M480 158 L275 168"/><path d="M480 204 L270 212"/><path d="M480 250 L266 256"/>
          </g>
          <!-- walker on the rim -->
          <g fill="#382520"><circle cx="110" cy="102" r="4"/><rect x="107" y="106" width="6" height="11" rx="2"/></g>
        </svg>
